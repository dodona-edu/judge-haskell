# Hints production code already triggers.
- ignore: {name: Eta reduce, within: [HUnitJudge.reportMsg]}
- ignore: {name: Redundant bracket, within: [HUnitJudge.isEqual, HUnitJudge.runTestJSON]}
- ignore: {name: Redundant <$>, within: [QuickCheckJudge.executeTestCase]}
- ignore: {name: Use unwords, within: [Utils.sjoin]}
