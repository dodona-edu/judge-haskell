name: E2E

on:
  workflow_call:
    inputs:
      image:
        description: Judge image to run the suite in
        type: string
        default: ghcr.io/dodona-edu/dodona-haskell:latest
      ref:
        description: judge-haskell ref to test
        type: string
        default: master
  workflow_dispatch:
    inputs:
      image:
        description: Judge image to run the suite in
        type: string
        default: ghcr.io/dodona-edu/dodona-haskell:latest
      ref:
        description: judge-haskell ref to test
        type: string
        default: master

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user root

    steps:
      - uses: actions/checkout@v7
        with:
          repository: dodona-edu/judge-haskell
          ref: ${{ inputs.ref }}
      - name: Run tests
        run: ./devel/run-tests.sh
